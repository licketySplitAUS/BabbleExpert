<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Fireworks</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#02030a;cursor:pointer}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}
</style>
</head>
<body aria-label="Fireworks celebration. Click to replay.">
<canvas id="sky"></canvas>
<script src="fireworks.js"></script>
<script>
const fireworks = createBabbleFireworks(document.getElementById('sky'), {
  onStart: () => { if (location.protocol === 'file:') location.replace('#fireworks=' + Date.now() + '-' + Math.random().toString(36).slice(2)); }
});
</script>
</body>
</html>
