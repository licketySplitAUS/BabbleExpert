<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Puzzle celebration</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#02030a;cursor:pointer}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}
#preview{position:fixed;bottom:12px;left:12px;right:12px;padding:10px;background:#142139eb;border:1px solid #ffffff55;border-radius:8px;color:white;font:14px Arial;cursor:default}button,select{font:inherit;padding:6px;margin:3px;max-width:100%}#hint{position:fixed;bottom:12px;right:12px;color:#fff9;font:12px Arial;pointer-events:none}
</style>
</head>
<body aria-label="Puzzle celebration. Click to replay. Press P to choose an effect.">
<canvas id="sky"></canvas>
<span id="hint">Click to replay · P to preview</span>
<div id="preview" hidden><label>Preview <select id="effect"><option value="">Surprise me</option></select></label><button id="play">Play</button><label><input id="sound" type="checkbox" checked> Sound</label><button id="close">Close controls</button></div>
<script src="fireworks.js"></script>
<script src="celebrations.js"></script>
<script>
const celebrationOptions = new URLSearchParams(location.search);
const requestedEffect = celebrationOptions.get('effect');
const fireworks = createBabbleCelebration(document.getElementById('sky'), {
  ...(['0', '1'].includes(celebrationOptions.get('animations')) ? { reducedMotion: celebrationOptions.get('animations') === '0' } : {}),
  effect: requestedEffect, fireworksFactory: createBabbleFireworks,
  onStart: ({ userInitiated, effect, animation, seed }) => { if (location.protocol === 'file:') location.replace('#fireworks=' + Date.now() + '-' + Math.random().toString(36).slice(2) + '&effect=' + effect + '&animation=' + animation + '&seed=' + seed + (userInitiated ? '&user=1' : '')); }
});
const panel = document.getElementById('preview'), select = document.getElementById('effect');
fireworks.effects.forEach((id, index) => { const option = document.createElement('option'); option.value = id; option.textContent = fireworks.labels[index]; select.appendChild(option); });
document.getElementById('play').onclick = () => fireworks.start({type:'click'}, select.value || 'random');
document.getElementById('sound').onchange = event => fireworks.setSoundEnabled(event.target.checked);
document.getElementById('close').onclick = () => { panel.hidden = true; };
document.addEventListener('keydown', event => { if (event.key.toLowerCase() === 'p' && event.target.tagName !== 'SELECT') panel.hidden = !panel.hidden; if (event.key === 'Escape') panel.hidden = true; });
</script>
</body>
</html>
