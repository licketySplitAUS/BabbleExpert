<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Chill Vibes</title>
<style>
:root{color-scheme:dark;font-family:"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#0b0a14;color:#f1ecff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('canvas');
const gl=canvas.getContext('webgl',{antialias:false,alpha:false});
if(!gl)return;
const vertex=`attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;
const fragment=`
precision highp float;
uniform vec2 R,O,D;
uniform float T,E,V,H,P;
uniform vec4 B[3];
uniform vec4 S[3];
uniform vec4 W[12];
float h(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;mat2 m=mat2(.8,-.6,.6,.8);for(int i=0;i<4;i++){s+=a*n(p);p=m*p*2.03+7.1;a*=.5;}return s;}
vec3 hsv(vec3 c){vec4 K=vec4(1.,2./3.,1./3.,3.);vec3 p=abs(fract(c.xxx+K.xyz)*6.-K.www);return c.z*mix(K.xxx,clamp(p-K.xxx,0.,1.),c.y);}
float dot2(vec2 v){return dot(v,v);}
float heart(vec2 p){p.x=abs(p.x);if(p.y+p.x>1.)return sqrt(dot2(p-vec2(.25,.75)))-sqrt(2.)/4.;return sqrt(min(dot2(p-vec2(0.,1.)),dot2(p-.5*max(p.x+p.y,0.))))*sign(p.x-p.y);}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*R)/R.y,local=uv*1.25,p=local+O;
  vec2 q=vec2(fbm(p+vec2(0.,T*.03)),fbm(p+vec2(5.2,1.3)-T*.025));
  vec2 side=vec2(-D.y,D.x);float along=dot(local,D)-P,across=dot(local,side);
  float wave=sin(along*2.-T*.12+3.*fbm(p*.7+q*2.))*.5+.5;
  float wave2=sin(along+across*.55-T*.08+q.x*4.)*.5+.5;
  vec2 warped=p+(q-.5)*1.9+D*(wave-.5)*(.35+E*.9);float grain=fbm(warped*.8+q*1.5);
  float hue=H+grain*.42+wave2*.14+(wave-.5)*(.07+E*.2),sat=.52+.22*grain-.05*wave2,val=.4+.42*grain+.12*wave;
  for(int i=0;i<3;i++){
    vec2 d=uv-B[i].xy+(q-.5)*.3;float vitality=S[i].w,amp=(.12+.3*V)*(1.+(1.-vitality)*.9);
    float angle=.3*sin(S[i].z+T*.15),c=cos(angle),sn=sin(angle);d=mat2(c,-sn,sn,c)*d;
    vec2 hp=d/(max(B[i].z,.001)*1.7)+vec2(0.,.5);hp+=amp*.4*vec2(sin(hp.y*3.+S[i].x+T*.22),sin(hp.x*3.+S[i].y-T*.17));
    float m=1.-smoothstep(-.3,.7,heart(hp));m*=m*vitality;hue+=m*B[i].w;val+=m*.26;sat-=m*.12;
  }
  float warm=0.,cool=0.;
  for(int i=0;i<12;i++){vec2 d=uv-W[i].xy+(q-.5)*.22;float m=exp(-pow(length(d)/max(W[i].z,.001),2.)*1.2)*abs(W[i].w);if(W[i].w>0.)warm+=m;else cool+=m;}
  warm=clamp(warm,0.,1.);cool=clamp(cool,0.,1.);hue+=sin(6.2832*(.035+grain*.09-wave2*.03-hue))*.25*warm;hue+=sin(6.2832*(.56+grain*.08+wave2*.04-hue))*.22*cool;
  sat+=warm*.14+cool*.08;val+=warm*.12-cool*.1;vec3 col=hsv(vec3(hue,clamp(sat,0.,1.),clamp(val,0.,1.)));col+=(h(gl_FragCoord.xy)-.5)/200.;gl_FragColor=vec4(col,1.);
}`;
function shader(type,source){const item=gl.createShader(type);gl.shaderSource(item,source);gl.compileShader(item);return item}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);gl.useProgram(program);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const attr=gl.getAttribLocation(program,'a');gl.enableVertexAttribArray(attr);gl.vertexAttribPointer(attr,2,gl.FLOAT,false,0,0);
const U=name=>gl.getUniformLocation(program,name),uR=U('R'),uO=U('O'),uD=U('D'),uT=U('T'),uE=U('E'),uV=U('V'),uH=U('H'),uP=U('P'),uB=U('B'),uS=U('S'),uW=U('W');
function resize(){const scale=Math.min(devicePixelRatio||1,2)*.6;canvas.width=Math.max(2,innerWidth*scale|0);canvas.height=Math.max(2,innerHeight*scale|0);gl.viewport(0,0,canvas.width,canvas.height)}
addEventListener('resize',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a),seeds=()=>[rnd(0,6.3),rnd(0,6.3),rnd(0,6.3)],aspect=()=>innerWidth/innerHeight;
let offset=[rnd(0,50),rnd(0,50)],velocity=[0,0],smooth=[0,0],angle=rnd(0,Math.PI*2),energy=0,viscosity=.5,hue=Math.random(),phase=0,last=performance.now(),time=rnd(0,100);
const blobs=[0,1,2].map((_,i)=>{const b={x:rnd(-.3,.3),y:rnd(-.5,.5),r:rnd(.22,.4),hue:[.28,-.22,.45][i],seed:seeds(),targetSeed:seeds(),next:rnd(2,8),life:rnd(20,42),vitality:i<2?1:.35};b.tx=b.x;b.ty=b.y;b.tr=b.r;return b});
const spots=[];
function push(x,y,strength=1){velocity[0]+=x*1.7*strength;velocity[1]+=y*1.7*strength}
function hash(text){let value=2166136261;for(const ch of String(text)){value^=ch.codePointAt(0);value=Math.imul(value,16777619)}return value>>>0}
function addSpot(seed,index=0,total=1,intensity=1,rise=4){
  if(spots.length>=12)spots.shift();const h=(seed+index*2654435761)>>>0;
  const x=((h&1023)/1023-.5)*aspect()*.9,y=(((h>>>10)&1023)/1023-.5)*.9;
  spots.push({x,y,r:.11+((h>>>20)&255)/255*.13,power:0,target:intensity,rise,sign:(h&1)?1:-1,life:2.8+Math.min(4,total*.18)});
  const a=(h%6283)/1000;push(Math.cos(a)*.055,Math.sin(a)*.055,intensity*(.7+Math.min(1,total/10)));
}
function keyPulse(key){const seed=hash(key||'key');addSpot(seed,0,1,.3,1.15);energy=Math.min(1,energy+.025);phase+=.004;canvas.dataset.interaction='key'}
function showWord(text,color){
  const clean=String(text||'').trim();if(!clean)return;
  canvas.dataset.interaction='word';
  [...clean].forEach((ch,index)=>setTimeout(()=>addSpot(hash(ch+clean),index,clean.length),index*35));energy=Math.min(1,energy+.45);phase+=.08+clean.length*.008;
}
function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;time+=dt;
  const speed=Math.hypot(velocity[0],velocity[1]);smooth[0]+=(velocity[0]-smooth[0])*Math.min(1,dt*1.35);smooth[1]+=(velocity[1]-smooth[1])*Math.min(1,dt*1.35);
  const smoothed=Math.hypot(smooth[0],smooth[1]);if(smoothed>.01){let turn=Math.atan2(smooth[1],smooth[0])-angle;turn=Math.atan2(Math.sin(turn),Math.cos(turn));angle+=turn*Math.min(1,dt)}else angle+=dt*.02;
  const dx=Math.cos(angle),dy=Math.sin(angle);offset[0]+=(.012+velocity[0])*dt;offset[1]+=(.008+velocity[1])*dt;phase+=(.02+(velocity[0]*dx+velocity[1]*dy)*1.5)*dt;
  velocity[0]*=Math.exp(-dt*.9);velocity[1]*=Math.exp(-dt*.9);energy+=(Math.min(1,speed*2.7)-energy)*Math.min(1,dt*.8);viscosity=.5+.4*Math.sin(time*.05)+.1*Math.sin(time*.13+2);hue=(hue+dt*(.004+energy*.012))%1;
  const bArray=new Float32Array(12),sArray=new Float32Array(12),wArray=new Float32Array(48),asp=aspect();
  blobs.forEach((b,i)=>{b.next-=dt;b.life-=dt;if(b.next<=0){b.next=rnd(6,14);b.tx=rnd(-.45,.45)*asp*.9;b.ty=rnd(-.52,.52);b.tr=rnd(.2,.44)*(1+energy*.35);b.targetSeed=seeds()}if(b.life<=0){b.life=rnd(20,42);b.vitality=.25}else b.vitality+=(1-b.vitality)*dt*.08;
    const k=dt*(.1+.28*(1-viscosity)+energy*.2);b.x+=(b.tx-b.x)*k;b.y+=(b.ty-b.y)*k;b.r+=(b.tr-b.r)*k;for(let j=0;j<3;j++)b.seed[j]+=(b.targetSeed[j]-b.seed[j])*k*.6;b.x+=velocity[0]*dt*.2;b.y+=velocity[1]*dt*.2;
    bArray.set([b.x,b.y,b.r*(.3+.7*b.vitality)*(1+.06*Math.sin(time*.4+i*2)),b.hue],i*4);sArray.set([b.seed[0],b.seed[1],b.seed[2],b.vitality],i*4)});
  for(let i=spots.length-1;i>=0;i--){const spot=spots[i];spot.life-=dt;spot.power+=(spot.target-spot.power)*Math.min(1,dt*spot.rise);spot.target*=Math.exp(-dt*.34);spot.r+=dt*.008;if(spot.life<=0||spot.target<.006)spots.splice(i,1)}
  spots.forEach((spot,i)=>wArray.set([spot.x,spot.y,spot.r,spot.power*spot.sign],i*4));
  gl.uniform4fv(uW,wArray);gl.uniform2f(uR,canvas.width,canvas.height);gl.uniform2f(uO,offset[0],offset[1]);gl.uniform2f(uD,dx,dy);gl.uniform1f(uT,time);gl.uniform1f(uE,energy);gl.uniform1f(uV,viscosity);gl.uniform1f(uH,hue);gl.uniform1f(uP,phase);gl.uniform4fv(uB,bArray);gl.uniform4fv(uS,sArray);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('keydown',event=>{if(!event.repeat)keyPulse(event.key)});
window.BabbleExpertInteract=event=>{
  if(!event)return;
  if(event.type==='key'){keyPulse(event.key);return}
  if(event.type==='word'&&event.phase==='submit')showWord(event.word,event.color);
};
})();
</script>
</body>
</html>
