name: Build installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64
      - run: xvfb-run -a npm run test:e2e
      - run: xvfb-run -a node test/e2e/run.js login-main.js --no-sandbox
      - run: xvfb-run -a node test/e2e/run.js tour-main.js --no-sandbox
      - run: xvfb-run -a node test/e2e/run.js resource-relay-main.js --no-sandbox
      - run: xvfb-run -a node test/e2e/run.js create-clues-main.js --no-sandbox
      - run: xvfb-run -a node test/e2e/run.js tile-undo-main.js --no-sandbox
      - uses: actions/checkout@v4
        with:
          repository: licketySplitAUS/Babble
          path: resource-fixtures
      - run: xvfb-run -a node test/e2e/run.js resource-scroll-main.js --no-sandbox
        env:
          WORD_LIST_DIR: ${{ github.workspace }}/resource-fixtures
      - run: xvfb-run -a node test/e2e/run.js word-list-main.js --no-sandbox
        env:
          WORD_LIST_DIR: ${{ github.workspace }}/resource-fixtures

  build:
    needs: test
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned builds; see README to add signing
      - uses: actions/upload-artifact@v4
        with:
          name: babble-expert-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/latest*.yml
            dist/*.blockmap

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          name: Babble Expert ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
