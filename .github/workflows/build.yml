name: Build installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run release:check
      - run: npm test
      - run: sudo apt-get update && sudo apt-get install -y xvfb openbox libgtk-3-0 libnss3 libasound2t64
      - run: xvfb-run -a sh -c 'openbox >/tmp/babble-openbox.log 2>&1 & npm run test:e2e'
      - run: xvfb-run -a sh -c 'openbox >/tmp/babble-openbox.log 2>&1 & node test/e2e/run.js startup-main.js --no-sandbox'
      - run: xvfb-run -a sh -c 'openbox >/tmp/babble-openbox.log 2>&1 & node test/e2e/run.js diagnostics-main.js --no-sandbox'
      - run: xvfb-run -a sh -c 'openbox >/tmp/babble-openbox.log 2>&1 & node test/e2e/run.js reliability-ui-main.js --no-sandbox'
      - run: xvfb-run -a sh -c 'openbox >/tmp/babble-openbox.log 2>&1 & node test/e2e/run.js hints-main.js --no-sandbox'
      - run: xvfb-run -a sh -c 'openbox >/tmp/babble-openbox.log 2>&1 & node test/e2e/run.js login-main.js --no-sandbox'
      - run: xvfb-run -a sh -c 'openbox >/tmp/babble-openbox.log 2>&1 & node test/e2e/run.js tour-main.js --no-sandbox'
      - run: xvfb-run -a sh -c 'openbox >/tmp/babble-openbox.log 2>&1 & node test/e2e/run.js resource-relay-main.js --no-sandbox'
      - run: xvfb-run -a sh -c 'openbox >/tmp/babble-openbox.log 2>&1 & node test/e2e/run.js create-clues-main.js --no-sandbox'
      - run: xvfb-run -a sh -c 'openbox >/tmp/babble-openbox.log 2>&1 & node test/e2e/run.js release-notes-main.js --no-sandbox'
      - run: xvfb-run -a sh -c 'openbox >/tmp/babble-openbox.log 2>&1 & node test/e2e/update-highlights-run.js'
      - run: xvfb-run -a sh -c 'openbox >/tmp/babble-openbox.log 2>&1 & node test/e2e/run.js lickety-message-main.js --no-sandbox'
      - run: xvfb-run -a sh -c 'openbox >/tmp/babble-openbox.log 2>&1 & node test/e2e/run.js zoom-layout-main.js --no-sandbox'
      - run: xvfb-run -a sh -c 'openbox >/tmp/babble-openbox.log 2>&1 & node test/e2e/run.js tile-undo-main.js --no-sandbox'
      - run: xvfb-run -a sh -c 'openbox >/tmp/babble-openbox.log 2>&1 & node test/e2e/run.js browser-tools-main.js --no-sandbox'
      - uses: actions/checkout@v4
        with:
          repository: licketySplitAUS/Babble
          path: resource-fixtures
      - run: xvfb-run -a sh -c 'openbox >/tmp/babble-openbox.log 2>&1 & node test/e2e/run.js resource-scroll-main.js --no-sandbox'
        env:
          WORD_LIST_DIR: ${{ github.workspace }}/resource-fixtures
      - run: xvfb-run -a sh -c 'openbox >/tmp/babble-openbox.log 2>&1 & node test/e2e/run.js word-list-main.js --no-sandbox'
        env:
          WORD_LIST_DIR: ${{ github.workspace }}/resource-fixtures
      - run: xvfb-run -a sh -c 'openbox >/tmp/babble-openbox.log 2>&1 & node test/e2e/run.js resource-performance-main.js --no-sandbox'
        env:
          WORD_LIST_DIR: ${{ github.workspace }}/resource-fixtures
      - run: xvfb-run -a sh -c 'openbox >/tmp/babble-openbox.log 2>&1 & node test/e2e/run.js resource-loading-main.js --no-sandbox'
        env:
          WORD_LIST_DIR: ${{ github.workspace }}/resource-fixtures
      - run: xvfb-run -a sh -c 'openbox >/tmp/babble-openbox.log 2>&1 & node test/e2e/run.js next-clue-main.js --no-sandbox'
        env:
          WORD_LIST_DIR: ${{ github.workspace }}/resource-fixtures
      - run: xvfb-run -a sh -c 'openbox >/tmp/babble-openbox.log 2>&1 & node test/e2e/run.js progress-journal-main.js --no-sandbox'

  build:
    needs: test
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned distribution by maintainer choice
      - run: node tools/release/check.cjs dist
      - name: Smoke-test Windows installed upgrade
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/release/windows-install-smoke.ps1 -Installer dist/BabbleExpert-Windows-Setup.exe
      - name: Smoke-test packaged Mac application
        if: runner.os == 'macOS'
        run: node tools/release/packaged-smoke.cjs "dist/mac-universal/Babble Expert.app/Contents/MacOS/Babble Expert"
      - uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: babble-expert-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/latest*.yml
            dist/*.blockmap
            dist/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          name: Babble Expert ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: true
          make_latest: false
          generate_release_notes: false
